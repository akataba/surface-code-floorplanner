name: Core tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e .
      - run: python scripts/check_docstrings.py
      - run: python -m unittest discover -s tests
      # Native integration tests explicitly skip until external binaries are supplied.

  synthesis-and-semantics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e '.[haar]'
      - run: python -m unittest discover -s tests
      # Native output checks require an external adapter and are not certified by this job.
