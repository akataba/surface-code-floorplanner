name: Documentation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r docs/requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python scripts/check_docstrings.py
      - run: python -m sphinx -n -W --keep-going -b html docs docs/_build/html
      - run: python -m sphinx -W --keep-going -b doctest docs docs/_build/doctest
      - run: python -m sphinx -W --keep-going -b linkcheck docs docs/_build/linkcheck
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-html
          path: docs/_build/html
