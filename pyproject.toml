[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-floorplan"
version = "0.1.0"
description = "Reproducible liblsqecc grid optimization and reproducible compiler integration"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]
dev = ["ruff==0.16.10"]
experiments = ["optuna==5.0.0", "mlflow==3.16.1"]
qft = ["pygridsynth==2.0.0", "numpy>=2.0"]

haar = ["pygridsynth==2.0.0", "numpy>=2.0", "qiskit==2.5.2"]

rl = ["torch==2.14.1", "optuna==5.0.0", "mlflow==3.16.1", "numpy>=2.0"]

[project.scripts]
lattice-floorplan-optimize = "lattice_floorplan.optimize_cli:main"
lattice-floorplan = "lattice_floorplan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "D405", "D410", "D411", "D412", "D414", "D417"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["D"]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
